<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <!-- Horizontal lockup: mark + wordmark — ideal for document headers -->
  <rect width="720" height="200" fill="#F5F3EB"/>

  <g transform="translate(20,0)">
    <defs>
      <clipPath id="HL"><rect x="0" y="0" width="100" height="200"/></clipPath>
      <clipPath id="HR"><rect x="100" y="0" width="100" height="200"/></clipPath>
      <clipPath id="HC"><circle cx="100" cy="100" r="78"/></clipPath>
    </defs>
    <circle cx="100" cy="100" r="78" fill="#FFFFFF" stroke="#000" stroke-width="5"/>
    <line x1="100" y1="22" x2="100" y2="178" stroke="#000" stroke-width="4"/>
    <g clip-path="url(#HL)">
      <g clip-path="url(#HC)">
        <g fill="none" stroke="#000" stroke-width="4" stroke-linecap="square">
          <line x1="100" y1="30" x2="100" y2="42"/>
          <line x1="65" y1="40"  x2="72" y2="50"/>
          <line x1="40" y1="65"  x2="50" y2="72"/>
          <line x1="30" y1="100" x2="42" y2="100"/>
          <line x1="40" y1="135" x2="50" y2="128"/>
          <line x1="65" y1="160" x2="72" y2="150"/>
          <line x1="100" y1="170" x2="100" y2="158"/>
        </g>
        <circle cx="100" cy="100" r="36" fill="none" stroke="#000" stroke-width="4"/>
        <circle cx="100" cy="100" r="6" fill="#000"/>
      </g>
    </g>
    <g clip-path="url(#HR)">
      <g clip-path="url(#HC)" fill="none" stroke-width="6" stroke-linecap="round">
        <path d="M 100 38 Q 168 55 160 100" stroke="#E86B5A"/>
        <path d="M 100 62 Q 150 75 142 110" stroke="#F5C542"/>
        <path d="M 100 90 Q 140 105 128 135" stroke="#7CB56B"/>
        <path d="M 100 120 Q 130 140 110 162" stroke="#5B9BD5"/>
      </g>
    </g>
  </g>

  <!-- Divider -->
  <line x1="240" y1="55" x2="240" y2="145" stroke="#000" stroke-width="2"/>

  <!-- Wordmark -->
  <g transform="translate(265,0)"
     font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif"
     fill="#000">
    <text x="0" y="98" font-size="44" font-weight="800" letter-spacing="2.5">AUTOMATA</text>
    <text x="0" y="132" font-size="22" font-weight="600" letter-spacing="6" fill="#5C5750">LEARNING LAB</text>
  </g>
</svg>
